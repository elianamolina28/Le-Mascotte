<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Probar Cambio de Estado - Le Mascotte</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; }
        input, select, button { display: block; width: 100%; padding: 10px; margin: 8px 0; font-size: 16px; }
        button { background: #6b124f; color: white; border: none; cursor: pointer; }
        button:hover { background: #8a1a6a; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .pedido-btn { display: inline-block; margin: 3px; padding: 5px 10px; background: #eee; border: 1px solid #ccc; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .pedido-btn:hover { background: #ddd; }
    </style>
</head>
<body>
    <h1>🔧 PROBAR CAMBIO DE ESTADO</h1>
    
    <div style="margin: 20px 0; padding: 15px; background: #fff3cd; border-radius: 8px;">
        <strong>⚠️ Prueba 1: Buscar pedidos existentes</strong>
    </div>
    <button onclick="buscarPedidos()">Buscar Pedidos en BD</button>
    <div id="pedidosList"></div>

    <hr>
    <div style="margin: 20px 0; padding: 15px; background: #cce5ff; border-radius: 8px;">
        <strong>🧪 Prueba 2: Cambiar estado manualmente</strong>
    </div>
    <label>ID del Pedido:</label>
    <input type="text" id="pedidoId" placeholder="Ej: PED20260624123456123" />
    <label>Nuevo estado:</label>
    <select id="nuevoEstado">
        <option value="Pendiente">Pendiente</option>
        <option value="Preparando">Preparando</option>
        <option value="Enviado">Enviado</option>
        <option value="Entregado">Entregado</option>
        <option value="Cancelado">Cancelado</option>
    </select>
    <button onclick="cambiarEstado()">Cambiar Estado</button>
    <div id="resultado"></div>

    <hr>
    <div style="margin: 20px 0; padding: 15px; background: #d4edda; border-radius: 8px;">
        <strong>✅ Prueba 3: Verificar estado actual de un pedido</strong>
    </div>
    <input type="text" id="verificarId" placeholder="ID del pedido a verificar" />
    <button onclick="verificarEstado()">Verificar Estado</button>
    <div id="verificarResult"></div>

    <script>
        const BASE_URL = window.location.origin + '/Mocap%20Le%20Mascotte.V4.2.0';

        async function buscarPedidos() {
            const div = document.getElementById('pedidosList');
            div.innerHTML = '<p>Cargando...</p>';
            try {
                const res = await fetch(BASE_URL + '/api/config.php?action=listar_pedidos');
                const text = await res.text();
                div.innerHTML = '<pre>' + text.substring(0, 2000) + '</pre>';
            } catch(e) {
                div.innerHTML = '<span class="error">Error: ' + e.message + '</span>';
            }
        }

        async function cambiarEstado() {
            const id = document.getElementById('pedidoId').value.trim();
            const status = document.getElementById('nuevoEstado').value;
            const div = document.getElementById('resultado');

            if (!id) {
                div.innerHTML = '<span class="error">⚠️ Ingresa un ID de pedido</span>';
                return;
            }

            div.innerHTML = '<p>⏳ Enviando petición...</p>';
            console.log('Enviando:', JSON.stringify({id, status}));

            try {
                // Probar ENDPOINT ULTRA-SIMPLE
                const res = await fetch(BASE_URL + '/api/set_pedido_status.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id, status})
                });
                const text = await res.text();
                let json;
                try { json = JSON.parse(text); } catch(e) { json = null; }
                
                let html = '<h3>📨 Respuesta RAW:</h3><pre>' + text + '</pre>';
                if (json && json.success) {
                    html += '<p class="success">✅ ÉXITO: ' + json.message + '</p>';
                } else {
                    html += '<p class="error">❌ ERROR: ' + (json ? json.message : text.substring(0,200)) + '</p>';
                }

                // También probar con el otro endpoint
                html += '<hr><h3>📨 Prueba con update_pedido_status.php:</h3>';
                try {
                    const res2 = await fetch(BASE_URL + '/api/update_pedido_status.php', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({id, status})
                    });
                    const text2 = await res2.text();
                    html += '<pre>' + text2.substring(0, 500) + '</pre>';
                } catch(e) {
                    html += '<span class="error">Error: ' + e.message + '</span>';
                }

                div.innerHTML = html;
            } catch(e) {
                div.innerHTML = '<span class="error">❌ Error de conexión: ' + e.message + '</span>';
            }
        }

        async function verificarEstado() {
            const id = document.getElementById('verificarId').value.trim();
            const div = document.getElementById('verificarResult');
            if (!id) { div.innerHTML = '<span class="error">⚠️ Ingresa un ID</span>'; return; }
            try {
                const res = await fetch(BASE_URL + '/api/config.php?action=verificar_pedido&id=' + id);
                const text = await res.text();
                div.innerHTML = '<pre>' + text.substring(0, 1000) + '</pre>';
            } catch(e) {
                div.innerHTML = '<span class="error">Error: ' + e.message + '</span>';
            }
        }
    </script>
</body>
</html>
